name: CI

on:
  push:
    branches: [ main, master, claude/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # `pnpm/action-setup@v4` reads the pnpm version from
        # package.json#packageManager automatically. Specifying a
        # `version` key here collides with that and aborts the step
        # with "Multiple versions of pnpm specified". Let the action
        # pick up the version from packageManager so there's a single
        # source of truth.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        # --max-warnings is intentionally not set: the codebase carries
        # ~1650 legacy warnings (unused imports, no-explicit-any in
        # runtime-flex code, exhaustive-deps in effect-heavy game
        # logic). Errors still fail the build; warnings are advisory
        # and tracked as tech debt until reduced in a follow-up pass.
        run: pnpm run lint

      - name: Type-check (tsc --noEmit)
        run: pnpm run check

      - name: Run unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          VITE_APP_ID: "ci-build"
          OAUTH_SERVER_URL: "https://stub.example.com"
          VITE_OAUTH_PORTAL_URL: "https://stub.example.com/portal"

      - name: Check bundle size
        run: |
          DIST_SIZE=$(du -sk dist/public 2>/dev/null | cut -f1 || echo "0")
          echo "Bundle size: ${DIST_SIZE}KB"
          if [ "$DIST_SIZE" -gt 51200 ]; then
            echo "::warning::Bundle exceeds 50MB — consider code splitting or asset optimization"
          fi
