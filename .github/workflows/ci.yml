name: CI

on:
  push:
    branches: [ main, master, claude/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm run lint --max-warnings=0 || true
        continue-on-error: true

      - name: Type-check (tsc --noEmit)
        run: pnpm run check

      - name: Run unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          VITE_APP_ID: "ci-build"
          OAUTH_SERVER_URL: "https://stub.example.com"
          VITE_OAUTH_PORTAL_URL: "https://stub.example.com/portal"

      - name: Check bundle size
        run: |
          DIST_SIZE=$(du -sk dist/public 2>/dev/null | cut -f1 || echo "0")
          echo "Bundle size: ${DIST_SIZE}KB"
          if [ "$DIST_SIZE" -gt 51200 ]; then
            echo "::warning::Bundle exceeds 50MB — consider code splitting or asset optimization"
          fi
