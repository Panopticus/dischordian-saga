name: CI

on:
  push:
    branches: [ main, master, claude/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (tsc --noEmit)
        run: pnpm run check

      - name: Run unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          # Build-time env stubs — replace with real secrets when deploying
          VITE_APP_ID: "ci-build"
          OAUTH_SERVER_URL: "https://stub.example.com"
          VITE_OAUTH_PORTAL_URL: "https://stub.example.com/portal"
