  <path d="M24 24 L29 27" />
  <!-- Center pivot -->
  <circle cx="24" cy="24" r="1.5" fill="currentColor" stroke="none" />
  <!-- Four corner lattice nubs to suggest crystal facets -->
  <circle cx="24" cy="4" r="1" fill="currentColor" stroke="none" />
  <circle cx="24" cy="44" r="1" fill="currentColor" stroke="none" />
  <circle cx="7" cy="24" r="1" fill="currentColor" stroke="none" />
  <circle cx="41" cy="24" r="1" fill="currentColor" stroke="none" />
</svg>
