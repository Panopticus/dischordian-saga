<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Outer hexagon — crystalline lattice memory frame -->
  <path d="M24 4 L41 14 L41 34 L24 44 L7 34 L7 14 Z" />
  <!-- Inner hexagon — the running clock underneath the memory -->
  <path d="M24 12 L34 18 L34 30 L24 36 L14 30 L14 18 Z" opacity="0.55" />
