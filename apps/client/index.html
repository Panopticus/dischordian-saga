    <!-- Preload critical art assets for instant first paint — hardcoded CDN
         URL since HTML can't call assetUrl(). Keep in sync with PUBLIC_ASSET_BASE
         in apps/client/src/lib/assetUrl.ts. -->
    <link rel="preload" as="image" href="https://dgrsart.s3.us-east-2.amazonaws.com/cdn/client-public/art/ui/title-bg.png" crossorigin />
    <link rel="preload" as="image" href="https://dgrsart.s3.us-east-2.amazonaws.com/cdn/client-public/art/loading/loading-bridge.png" crossorigin />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
  </head>
  <body>
    <!-- Void Energy Anti-FOUC Bootloader — runs BEFORE React mounts.
         Reads saved theme/density preferences from localStorage and sets
         data attributes on <html> so the CSS physics engine is active
         from the very first paint. No flash of wrong theme. -->
    <script>
      (function(){
        var h=document.documentElement;
        try{
          var a=localStorage.getItem('ve-atmosphere')||'twilight_equilibrium';
          var p=localStorage.getItem('ve-physics')||'flat';
          var m=localStorage.getItem('ve-mode')||'dark';
          var d=localStorage.getItem('ve-density')||'standard';
          // Enforce constraints
          if(p==='glass'&&m==='light'){p='flat';}
          if(p==='retro'&&m==='light'){m='dark';}
          h.setAttribute('data-atmosphere',a);
          h.setAttribute('data-physics',p);
          h.setAttribute('data-mode',m);
          h.setAttribute('data-density',d);
        }catch(e){}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
