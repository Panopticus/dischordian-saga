<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CADES UNIT</title>
<style>
  body { margin: 0; background: #000; color: #8b5cf6; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  h1 { color: #f59e0b; font-size: 24px; letter-spacing: 0.3em; }
  p { color: #8b5cf6; font-size: 12px; margin-top: 8px; }
  .note { color: #e2e8f0; opacity: 0.4; font-size: 10px; margin-top: 24px; max-width: 400px; text-align: center; }
</style>
</head>
<body>
  <h1>CADES UNIT</h1>
  <p>CONSCIOUSNESS ARCHIVAL AND DREAM ENGAGEMENT SYSTEM</p>
  <p class="note">
    This is a placeholder. Export the Godot 4.3 project at cades_fps/ to HTML5
    and place the output files here. The React app will communicate via PostMessage.
  </p>
  <script>
    // Signal ready to parent
    window.parent.postMessage({ type: 'CADES_READY' }, '*');
    // Listen for config
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'CADES_CONFIG') {
        console.log('CADES CONFIG received:', e.data.payload);
        document.querySelector('.note').textContent =
          'Config received: mode=' + e.data.payload.mode +
          '. Replace this placeholder with the Godot HTML5 export.';
      }
    });
  </script>
</body>
</html>
